# 内置手眼标定档案 —— GUI 内部资产,随包发布、只读。按 adapter 名索引。
#
# 每条档案回答标定运行需要、而本体运行配置回答不了的两件事:
#   profile        写进临时标定 YAML 的 `calibration:` 段(轨迹空间、可观测性阈值、
#                  采集门限)。标定工作流从这里读,不从运行配置读。
#   env_overrides  建标定会话前 deep-merge 进 `env.cfg.low_level` 的覆盖项。运行
#                  配置的软限位是按任务收紧的,而标定要求姿态尽量张开——不放宽的话
#                  示教到的姿态会在采集时被驱动拒绝。标定不经过 SafetyRail(那是
#                  agent 的 rail),驱动的限位检查才是这里要放开的那道。
#
# 正式标定文件的落盘位置按约定推导,不在这里逐条声明:
#   configs/<adapter>/calibration/<adapter>_<mount>.json
# mount 是文件名的一部分,所以同一本体日后同时支持两种安装方式也不会互相覆盖。确有
# 需要时可用一条可选的 output_relpath(相对 configs/)覆盖约定。
#
# camera_mount 只是**兜底**显示值:权威在运行配置的 env.cfg.low_level.camera_mount,
# 配置写了就以配置为准。这里写一份,是为了配置省略该项时界面仍能陈述相机装在哪,而
# 不是显示一个让人以为填错了的问号。
#
# 缺档案的 adapter 不会出现在标定工具里 —— 与其用一份猜出来的轨迹空间去动真机,
# 不如明确告诉用户该机型尚未接入。

profiles:
  so101:
    camera_mount: eye_to_hand
    profile:
      trajectory:
        space: joint            # SO-101 是 5-DoF,笛卡尔位姿常不可达,只走关节空间
      observability:
        min_relative_rotation_deg: 5.0
        min_axis_separation_deg: 15.0
        min_max_rotation_deg: 20.0
        min_translation_baseline_mm: 30.0
        duplicate_rotation_deg: 2.0
        duplicate_translation_mm: 5.0
      capture_gate:
        # STS3215 舵机无积分项,重力负载下稳态偏差可达 ~3.5°。默认 0.5° 的到位门
        # 会把本来有效的站点全部丢掉——标定记录的是真实关节角的 FK,没到位不等于
        # 观测无效,只要曝光期间不漂即可。
        reach_rotation_deg: 4.0
        reach_translation_mm: 0.5
        exposure_rotation_deg: 1.0
        exposure_translation_mm: 0.5
    env_overrides:
      home_use_init_pose: true  # 标定每次起始位不同,用当前位姿作 home
      disable_torque_on_disconnect: false  # 断连保持力矩,避免负载关节下坠
      joint_limits:
        shoulder_pan: [-180.0, 180.0]
        shoulder_lift: [-180.0, 180.0]
        elbow_flex: [-180.0, 180.0]
        wrist_flex: [-180.0, 180.0]
        wrist_roll: [-180.0, 180.0]
      z_min_safe_mm: -1000000.0
      z_max_safe_mm: null
      workspace_bounds: null
      joint_tolerance_deg: 3.5
      settle_overcompensate: false

  piper:
    camera_mount: eye_in_hand   # 腕部相机
    profile:
      trajectory:
        space: joint            # 6-DoF 也可笛卡尔,但关节空间插值更稳
      observability:
        min_relative_rotation_deg: 5.0
        min_axis_separation_deg: 15.0
        min_max_rotation_deg: 20.0
        min_translation_baseline_mm: 30.0
        duplicate_rotation_deg: 2.0
        duplicate_translation_mm: 5.0
    env_overrides:
      # 标定不读旧标定:内参取自实时相机,法兰位姿取自驱动。挂着上一份产物只会让
      # "首次标定"依赖一份还不存在的文件,或让本轮结果受上一轮锚点影响。
      calib_path: null
      home_use_init_pose: true
      tool_offset_mm: 0.0       # 标定只读法兰位姿,与工具偏移无关
      z_min_safe_mm: 50.0       # 保留桌面保护:腕部相机标定仍在桌面上方运动
