<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis module ownership and cross-layer relationships</title><desc id="desc">The six-layer execution chain plus the Skill guidance plane, capability gate, and optional visual-perception branch.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#19324d" flood-opacity="0.11"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.lane{font-size:18px;font-weight:700;fill:#fff}.node{font-size:14px;font-weight:700}.sub{font-size:12px;fill:#5b6b82}.panel{font-size:16px;font-weight:700}.edge{fill:none;stroke:#334e68;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d97706;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dash-arrow)}.label{font-size:11px;font-weight:600;fill:#855108}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1600" height="1000" rx="24" fill="#f4f7fc"/><text x="38" y="47" class="title">Module ownership and cross-layer relationships</text><text x="38" y="72" class="subtitle">The six-layer execution chain is on the left; Skill guidance, capability gating, and optional visual perception are grouped on the right.</text>
  <g>
    <rect x="32" y="102" width="1118" height="120" rx="16" fill="#eaf3ff" stroke="#aac9f3"/><rect x="32" y="102" width="160" height="120" rx="16" fill="#2563eb"/><rect x="176" y="102" width="16" height="120" fill="#2563eb"/><text x="112" y="169" text-anchor="middle" class="lane">Agent Layer</text>
    <rect x="32" y="233" width="1118" height="106" rx="16" fill="#fff7e8" stroke="#efc36f"/><rect x="32" y="233" width="160" height="106" rx="16" fill="#d97706"/><rect x="176" y="233" width="16" height="106" fill="#d97706"/><text x="112" y="293" text-anchor="middle" class="lane">Rails Layer</text>
    <rect x="32" y="350" width="1118" height="102" rx="16" fill="#edf5ff" stroke="#b7d2f7"/><rect x="32" y="350" width="160" height="102" rx="16" fill="#3b82f6"/><rect x="176" y="350" width="16" height="102" fill="#3b82f6"/><text x="112" y="408" text-anchor="middle" class="lane">Tool Layer</text>
    <rect x="32" y="463" width="1118" height="106" rx="16" fill="#f3efff" stroke="#c9bbf3"/><rect x="32" y="463" width="160" height="106" rx="16" fill="#8b5cf6"/><rect x="176" y="463" width="16" height="106" fill="#8b5cf6"/><text x="112" y="523" text-anchor="middle" class="lane">API Layer</text>
    <rect x="32" y="580" width="1118" height="106" rx="16" fill="#ecf9f4" stroke="#acd9c6"/><rect x="32" y="580" width="160" height="106" rx="16" fill="#059669"/><rect x="176" y="580" width="16" height="106" fill="#059669"/><text x="112" y="640" text-anchor="middle" class="lane">Env Layer</text>
    <rect x="32" y="697" width="1118" height="146" rx="16" fill="#e8f7f1" stroke="#9ed2bd"/><rect x="32" y="697" width="160" height="146" rx="16" fill="#047857"/><rect x="176" y="697" width="16" height="146" fill="#047857"/><text x="112" y="777" text-anchor="middle" class="lane">Hardware Layer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="220" y="130" width="185" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="313" y="155" text-anchor="middle" class="node">Python / CLI / GUI</text><text x="313" y="175" text-anchor="middle" class="sub">task entry and Voice</text>
    <rect x="430" y="130" width="190" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="525" y="155" text-anchor="middle" class="node">Configuration</text><text x="525" y="175" text-anchor="middle" class="sub">Adapter + Agent config</text>
    <rect x="645" y="130" width="210" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="750" y="155" text-anchor="middle" class="node">make_builder / Session</text><text x="750" y="175" text-anchor="middle" class="sub">assembly and lifecycle</text>
    <rect x="880" y="130" width="235" height="64" rx="11" fill="#2563eb"/><text x="998" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">run_robot_task / Agent</text><text x="998" y="175" text-anchor="middle" font-size="12" fill="#dbeafe">task orchestration and execution</text>
    <rect x="240" y="252" width="875" height="68" rx="12" fill="#fff" stroke="#e8b75d"/><text x="678" y="274" text-anchor="middle" class="node">before_tool_call / after_tool_call hook pipeline</text><text x="678" y="296" text-anchor="middle" class="sub">Safety · Recovery · VisualFeedback · Diagnosis · Trace · SkillUse</text><text x="678" y="313" text-anchor="middle" class="sub">Rails share one owner layer and are enabled by configuration and capabilities</text>
    <rect x="240" y="368" width="875" height="66" rx="12" fill="#fff" stroke="#88afe8"/><text x="678" y="390" text-anchor="middle" class="node">Tool Surface</text><text x="678" y="412" text-anchor="middle" class="sub">build_robot_tools · RobotControlTool · InProcessCodeTool</text><text x="678" y="429" text-anchor="middle" class="sub">runtime calls only capability-gated tools</text>
    <rect x="240" y="482" width="610" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="545" y="506" text-anchor="middle" class="node">BaseRobotApi + Capability Mixins</text><text x="545" y="527" text-anchor="middle" class="sub">Motion · Vision · Grasp · @robot_tool semantics</text><text x="545" y="544" text-anchor="middle" class="sub">adapters override only body-specific behavior</text>
    <rect x="875" y="482" width="240" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="995" y="507" text-anchor="middle" class="node">API capabilities</text><text x="995" y="528" text-anchor="middle" class="sub">derived from the Mixin MRO</text>
    <rect x="240" y="599" width="360" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="420" y="624" text-anchor="middle" class="node">BaseRobotEnv</text><text x="420" y="645" text-anchor="middle" class="sub">single hardware contract and stable verbs</text>
    <rect x="625" y="599" width="245" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="748" y="624" text-anchor="middle" class="node">RobotObservation</text><text x="748" y="645" text-anchor="middle" class="sub">pose, joints, frames, state</text>
    <rect x="895" y="599" width="220" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="1005" y="624" text-anchor="middle" class="node">Env capabilities</text><text x="1005" y="645" text-anchor="middle" class="sub">manual frozenset</text>
    <rect x="240" y="737" width="230" height="68" rx="12" fill="#fff" stroke="#69b396"/><text x="355" y="762" text-anchor="middle" class="node">Vendor Driver</text><text x="355" y="783" text-anchor="middle" class="sub">serial / CAN / SDK</text>
    <rect x="500" y="737" width="300" height="68" rx="12" fill="#047857"/><text x="650" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Robot / Gripper / Suction</text><text x="650" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">physical robot body</text>
    <rect x="830" y="737" width="285" height="68" rx="12" fill="#047857"/><text x="973" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Camera / Depth</text><text x="973" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">visual-perception data source</text>
  </g>
