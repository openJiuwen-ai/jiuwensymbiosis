  <rect x="1180" y="628" width="388" height="215" rx="16" fill="#fff7e8" stroke="#efc36f"/><text x="1202" y="658" class="panel" fill="#b45309">Optional visual-perception branch</text><rect x="1210" y="680" width="145" height="58" rx="10" fill="#fff" stroke="#e8b75d"/><text x="1283" y="704" text-anchor="middle" class="node">Detector client</text><text x="1283" y="723" text-anchor="middle" class="sub">called by VisionMixin</text><rect x="1393" y="680" width="145" height="58" rx="10" fill="#fff" stroke="#e8b75d"/><text x="1466" y="704" text-anchor="middle" class="node">Detector sidecar</text><text x="1466" y="723" text-anchor="middle" class="sub">owned by Session</text><rect x="1270" y="760" width="210" height="54" rx="10" fill="#d97706"/><text x="1375" y="783" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">GroundingDINO + SAM2</text><text x="1375" y="801" text-anchor="middle" font-size="11" fill="#fef3c7">detection and segmentation</text><path d="M1355 709H1393" class="dash"/><path d="M1466 738V750H1375V760" class="dash"/><path d="M850 516H1160V709H1210" class="dash"/><path d="M750 130V90H1580V709H1538" class="dash"/><text x="1390" y="84" class="label">RobotSession owns sidecar lifecycle</text>
