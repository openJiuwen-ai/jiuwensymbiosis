<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1660" viewBox="0 0 1800 1660" role="img" aria-labelledby="title desc">
<title id="title">Symbiosis 统一 Chat：场景、机器人与仿真</title>
<desc id="desc">目标设计，尚未完成业务实现。GUI 和 CLI 共用公共配置入口、ChatService、ChatEngine 与 ChatRun。model 加 scene 即可进行空间聊天，无需 adapter、env、detector 或 RobotSession。只有 scene 注入可选 SceneContext，按路径读取 PAI/HOVSG 数据并复用检索。allow_actions 默认 false，跳过额外执行配置解析和绑定；为 true 时机器人和仿真沿用已有配置及执行链，通过 TaskExecutor 接入。Genesis 既有预览和只读相机保持原机制，默认遵循 head-camera-only。场景目标进入执行前需要实时 TargetBinding。消息、证据、任务结果与清理返回同一轮次。</desc>
<defs>
