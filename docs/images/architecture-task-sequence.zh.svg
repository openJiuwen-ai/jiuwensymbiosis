<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1188" viewBox="0 0 1200 1188" role="img" aria-labelledby="title desc">
  <title id="title">任务执行时序：两种编排方式</title>
  <desc id="desc">已连接 Session 中，调用方调用 run_robot_task。fastagent 先规划序列，再通过执行器逐步调用动作工具；stepagent 调用 agent.invoke，由模型选择工具并读取结果。普通动作由 Rails 事件及 API、Env、Driver 完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334e68"/></marker>
    <marker id="input-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b45309"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; } path, line { stroke-linejoin: round; stroke-linecap: round; }</style>
  </defs>
  <rect x="0" y="0" width="1200" height="1188" rx="24" fill="#f4f7fc"/>
  <text id="text-1" x="40" y="52" font-size="32" font-weight="700" fill="#172033" text-anchor="start" data-max-width="1120">任务执行时序：两种编排方式</text>
  <text id="text-2" x="40" y="91" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1120">调用方管理会话；fastagent 与 stepagent 二选一。图中仅保留关键调用与返回。</text>
  <rect x="32" y="204" width="1136" height="124" rx="16" fill="#eaf3ff" stroke="#aac9f3" stroke-width="1.5"/>
  <rect x="32" y="348" width="1136" height="514" rx="16" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="50" y="404" width="1100" height="220" rx="10" fill="none" stroke="#c9bbf3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="50" y="642" width="1100" height="198" rx="10" fill="none" stroke="#aac9f3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <line x1="140" y1="184" x2="140" y2="862" stroke="#9aabc0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="36" y="118" width="208" height="66" rx="18" fill="#f0f4f9" stroke="#bac9da" stroke-width="1.5"/>
  <rect x="36" y="118" width="208" height="54" rx="18" fill="#526174"/>
  <rect x="36" y="154" width="208" height="18" rx="0" fill="#526174"/>
  <text id="text-3" x="140.0" y="153" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="184">调用方</text>
  <rect x="36" y="161" width="208" height="23" rx="0" fill="#f0f4f9"/>
  <text id="text-4" x="140" y="179" font-size="18" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="196">CLI / GUI / Python</text>
  <line x1="440" y1="184" x2="440" y2="862" stroke="#9aabc0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="336" y="118" width="208" height="66" rx="18" fill="#eaf3ff" stroke="#aac9f3" stroke-width="1.5"/>
  <rect x="336" y="118" width="208" height="54" rx="18" fill="#2563eb"/>
  <rect x="336" y="154" width="208" height="18" rx="0" fill="#2563eb"/>
  <text id="text-5" x="440.0" y="153" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="184">任务入口</text>
  <rect x="336" y="161" width="208" height="23" rx="0" fill="#eaf3ff"/>
  <text id="text-6" x="440" y="179" font-size="18" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="196">run_robot_task</text>
  <line x1="740" y1="184" x2="740" y2="862" stroke="#9aabc0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="636" y="118" width="208" height="66" rx="18" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="636" y="118" width="208" height="54" rx="18" fill="#7c3aed"/>
  <rect x="636" y="154" width="208" height="18" rx="0" fill="#7c3aed"/>
  <text id="text-7" x="740.0" y="153" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="184">Agent / 执行器</text>
  <rect x="636" y="161" width="208" height="23" rx="0" fill="#f3efff"/>
  <text id="text-8" x="740" y="179" font-size="18" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="196">编排与执行</text>
  <line x1="1060" y1="184" x2="1060" y2="862" stroke="#9aabc0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="956" y="118" width="208" height="66" rx="18" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="956" y="118" width="208" height="54" rx="18" fill="#047857"/>
  <rect x="956" y="154" width="208" height="18" rx="0" fill="#047857"/>
  <text id="text-9" x="1060.0" y="153" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="184">动作工具</text>
  <rect x="956" y="161" width="208" height="23" rx="0" fill="#ecf9f4"/>
  <text id="text-10" x="1060" y="179" font-size="18" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="196">绑定 API 方法</text>
  <rect x="48" y="210" width="510" height="32" rx="3" fill="#eaf3ff"/>
  <text id="text-11" x="52" y="236" font-size="23" font-weight="700" fill="#2563eb" text-anchor="start" data-max-width="1076">A. 提交任务（Session 已连接）</text>
  <rect x="48" y="356" width="570" height="32" rx="3" fill="#ecf9f4"/>
  <text id="text-12" x="52" y="382" font-size="23" font-weight="700" fill="#047857" text-anchor="start" data-max-width="1076">B. 按 exec_mode 选择一个分支</text>
  <rect x="64" y="410" width="296" height="30" rx="3" fill="#ecf9f4"/>
  <text id="text-13" x="68" y="434" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="start" data-max-width="1000">alt  fastagent（默认）</text>
  <rect x="64" y="650" width="208" height="30" rx="3" fill="#ecf9f4"/>
  <text id="text-14" x="68" y="674" font-size="21" font-weight="700" fill="#2563eb" text-anchor="start" data-max-width="1000">alt  stepagent</text>
  <path d="M140 286 L440 286" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="145.0" y="257" width="290" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-15" x="290.0" y="277" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="288">run_robot_task</text>
  <rect x="610" y="252" width="508" height="54" rx="10" fill="#f0f4f9" stroke="#bac9da" stroke-width="1.5"/>
  <text id="text-16" x="630" y="282" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="468">Session 负责连接，不负责动作编排。</text>
  <rect x="260" y="452" width="492" height="54" rx="10" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <text id="text-17" x="280" y="482" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="452">plan_task：生成并校验动作序列</text>
  <path d="M440 552 L740 552" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="441.0" y="523" width="298" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-18" x="590.0" y="543" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="288">run_sequence → 执行器</text>
  <path d="M740 600 L1060 600" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="835.0" y="571" width="130" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-19" x="900.0" y="591" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="308">robot_control 分派动作</text>
  <path d="M440 724 L740 724" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="441.0" y="695" width="298" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-20" x="590.0" y="715" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="288">agent.invoke(query)</text>
  <path d="M740 774 L1060 774" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="835.0" y="745" width="130" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-21" x="900.0" y="765" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="308">模型选择工具</text>
  <path d="M1060 822 L740 822" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#input-arrow)"/>
  <rect x="805.0" y="793" width="190" height="24" rx="3" fill="#f4f7fc"/>
  <text id="text-22" x="900.0" y="813" font-size="20" font-weight="600" fill="#172033" text-anchor="middle" data-max-width="308">结果供后续模型调用</text>
  <rect x="32" y="892" width="1136" height="120" rx="16" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="32" y="892" width="168" height="120" rx="16" fill="#047857"/>
  <rect x="184" y="892" width="16" height="120" rx="0" fill="#047857"/>
  <text id="text-23" x="116.0" y="945.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">普通动作</text>
  <text id="text-24" x="116.0" y="975.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">执行机制</text>
  <text id="text-25" x="228" y="930" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="910">前置检查 → 绑定的 API 方法 → 结果与事件处理</text>
  <text id="text-26" x="228" y="970" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="910">API 按动作需要调用共享算法、Env 和 Driver；Rails 按事件触发。</text>
  <rect x="32" y="1036" width="1136" height="84" rx="10" fill="#f0f4f9" stroke="#bac9da" stroke-width="1.5"/>
  <text id="text-27" x="52" y="1066" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1096">实时追踪使用专用伺服路径；Python 内部直接调用不逐条经过动作工具检查。</text>
  <text id="text-28" x="52" y="1096" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1096">退出会话：Trace 收尾 → Env / Driver 释放 → 自有资源清理。</text>
  <path d="M696 1152 L744 1152" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text id="text-29" x="756" y="1159" font-size="19" font-weight="400" fill="#526174" text-anchor="start" data-max-width="100">调用</text>
  <path d="M900 1152 L948 1152" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#input-arrow)"/>
  <text id="text-30" x="960" y="1159" font-size="19" font-weight="400" fill="#526174" text-anchor="start" data-max-width="170">返回</text>
</svg>
