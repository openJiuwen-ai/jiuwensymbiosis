<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1160" viewBox="0 0 1720 1160" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis 单次任务调用时序</title><desc id="desc">六层执行主链以及 Skill 指导、视觉感知支路和 Trace 证据存储在一次任务中的调用时序。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="ret-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.actor{font-size:13px;font-weight:700}.actor-sub{font-size:10px;fill:#5b6b82}.phase{font-size:15px;font-weight:700}.msg{font-size:12px;font-weight:600}.note{font-size:11px;fill:#5b6b82}.call{stroke:#334e68;stroke-width:2.1;marker-end:url(#arrow)}.ret{stroke:#d97706;stroke-width:2.1;stroke-dasharray:7 5;marker-end:url(#ret-arrow)}.life{stroke:#9aabc0;stroke-width:1.4;stroke-dasharray:5 5}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1720" height="1160" rx="24" fill="#f4f7fc"/><text x="38" y="46" class="title">单次任务调用时序</text><text x="38" y="71" class="subtitle">主调用严格沿 Agent → Rails → Tool → API → Env → Hardware；Skill 和视觉 sidecar 作为侧面机制接入</text>
  <rect x="28" y="142" width="1664" height="210" rx="16" fill="#eaf3ff" stroke="#b7d2f7"/><text x="45" y="169" class="phase" fill="#1d4ed8">A. 启动、装配与侧面机制初始化</text>
  <rect x="28" y="365" width="1664" height="445" rx="16" fill="#eefaf5" stroke="#acd9c6"/><text x="45" y="392" class="phase" fill="#047857">B. 一次工具调用：六层执行主链</text>
  <rect x="28" y="823" width="1664" height="137" rx="16" fill="#fff7e8" stroke="#efc36f"/><text x="45" y="850" class="phase" fill="#b45309">C. 结果回传与证据</text>
  <rect x="28" y="973" width="1664" height="136" rx="16" fill="#f3efff" stroke="#c9bbf3"/><text x="45" y="1000" class="phase" fill="#6d28d9">D. 会话关闭</text>

  <!-- Participants -->
  <g>
    <rect x="30" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="95" y="114" text-anchor="middle" class="actor">调用方</text>
    <rect x="195" y="88" width="130" height="42" rx="9" fill="#2563eb"/><text x="260" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RobotSession</text><text x="260" y="121" text-anchor="middle" font-size="10" fill="#dbeafe">Agent Layer</text>
    <rect x="365" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="430" y="106" text-anchor="middle" class="actor">Agent</text><text x="430" y="121" text-anchor="middle" class="actor-sub">任务编排</text>
    <rect x="535" y="88" width="130" height="42" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="106" text-anchor="middle" class="actor">Rails</text><text x="600" y="121" text-anchor="middle" class="actor-sub">Rails Layer</text>
    <rect x="705" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="770" y="106" text-anchor="middle" class="actor">Tool Surface</text><text x="770" y="121" text-anchor="middle" class="actor-sub">Tool Layer</text>
    <rect x="875" y="88" width="130" height="42" rx="9" fill="#f5f1ff" stroke="#aa94e7"/><text x="940" y="106" text-anchor="middle" class="actor">Robot API</text><text x="940" y="121" text-anchor="middle" class="actor-sub">API Layer</text>
    <rect x="1045" y="88" width="130" height="42" rx="9" fill="#ecf9f4" stroke="#76bfa1"/><text x="1110" y="106" text-anchor="middle" class="actor">BaseRobotEnv</text><text x="1110" y="121" text-anchor="middle" class="actor-sub">Env Layer</text>
    <rect x="1215" y="88" width="130" height="42" rx="9" fill="#047857"/><text x="1280" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Driver / Hardware</text><text x="1280" y="121" text-anchor="middle" font-size="10" fill="#d1fae5">Hardware Layer</text>
    <rect x="1385" y="88" width="130" height="42" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="1450" y="106" text-anchor="middle" class="actor">Vision sidecar</text><text x="1450" y="121" text-anchor="middle" class="actor-sub">可选感知支路</text>
    <rect x="1555" y="88" width="130" height="42" rx="9" fill="#d97706"/><text x="1620" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Trace 存储</text><text x="1620" y="121" text-anchor="middle" font-size="10" fill="#fef3c7">证据输出</text>
  </g>
  <g><line x1="95" y1="130" x2="95" y2="1112" class="life"/><line x1="260" y1="130" x2="260" y2="1112" class="life"/><line x1="430" y1="130" x2="430" y2="1112" class="life"/><line x1="600" y1="130" x2="600" y2="1112" class="life"/><line x1="770" y1="130" x2="770" y2="1112" class="life"/><line x1="940" y1="130" x2="940" y2="1112" class="life"/><line x1="1110" y1="130" x2="1110" y2="1112" class="life"/><line x1="1280" y1="130" x2="1280" y2="1112" class="life"/><line x1="1450" y1="130" x2="1450" y2="1112" class="life"/><line x1="1620" y1="130" x2="1620" y2="1112" class="life"/></g>

  <!-- Startup -->
  <line x1="95" y1="190" x2="260" y2="190" class="call"/><text x="178" y="182" text-anchor="middle" class="msg">进入 Session / connect()</text>
  <line x1="260" y1="225" x2="1110" y2="225" class="ret"/><text x="685" y="217" text-anchor="middle" class="msg">Env.connect()</text>
  <line x1="1110" y1="252" x2="1280" y2="252" class="ret"/><text x="1195" y="244" text-anchor="middle" class="msg">Driver 建连</text>
  <line x1="260" y1="277" x2="1450" y2="277" class="ret"/><text x="855" y="269" text-anchor="middle" class="msg">可选：启动 Detector sidecar</text>
  <line x1="260" y1="305" x2="430" y2="305" class="call"/><text x="345" y="297" text-anchor="middle" class="msg">构建 Agent 与工具集合</text>
  <rect x="700" y="286" width="500" height="42" rx="9" fill="#fff" stroke="#b9a8ec"/><text x="950" y="304" text-anchor="middle" class="msg">构建阶段能力门控</text><text x="950" y="320" text-anchor="middle" class="note">Tool Surface = API Mixin 能力 ∩ Env 硬件能力</text>
  <line x1="600" y1="338" x2="430" y2="338" class="ret"/><text x="515" y="330" text-anchor="middle" class="msg">可选：注入 SKILL.md 指导</text>

  <!-- Six-layer execution chain -->
  <line x1="95" y1="420" x2="260" y2="420" class="call"/><text x="178" y="412" text-anchor="middle" class="msg">提交任务</text>
  <line x1="260" y1="455" x2="430" y2="455" class="call"/><text x="345" y="447" text-anchor="middle" class="msg">invoke(query)</text>
  <line x1="430" y1="495" x2="600" y2="495" class="call"/><text x="515" y="487" text-anchor="middle" class="msg">before_tool_call</text>
  <rect x="538" y="510" width="124" height="48" rx="8" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="530" text-anchor="middle" class="msg">检查与门控</text><text x="600" y="547" text-anchor="middle" class="note">必要时拒绝</text>
  <line x1="600" y1="570" x2="430" y2="570" class="ret"/><text x="515" y="562" text-anchor="middle" class="msg">允许 / 可纠正错误</text>
  <line x1="430" y1="605" x2="770" y2="605" class="call"/><text x="600" y="597" text-anchor="middle" class="msg">调用已暴露工具</text>
  <line x1="770" y1="640" x2="940" y2="640" class="call"/><text x="855" y="632" text-anchor="middle" class="msg">绑定方法 / action 分派</text>
  <line x1="940" y1="675" x2="1110" y2="675" class="call"/><text x="1025" y="667" text-anchor="middle" class="msg">稳定 Env 动词</text>
  <line x1="1110" y1="710" x2="1280" y2="710" class="call"/><text x="1195" y="702" text-anchor="middle" class="msg">SDK / 协议命令</text>
  <line x1="1280" y1="745" x2="1110" y2="745" class="ret"/><text x="1195" y="737" text-anchor="middle" class="msg">状态 / 图像 / 结果</text>
  <line x1="940" y1="778" x2="1450" y2="778" class="ret"/><text x="1195" y="770" text-anchor="middle" class="msg">可选：VisionMixin → detect(frame)</text>
  <line x1="1450" y1="800" x2="940" y2="800" class="ret"/><text x="1195" y="792" text-anchor="middle" class="note">检测/分割 → RAW 投影 → 校正与抓放几何</text>

  <!-- Return and evidence -->
  <line x1="1110" y1="867" x2="940" y2="867" class="ret"/><text x="1025" y="859" text-anchor="middle" class="msg">RobotObservation / API 结果</text>
  <line x1="940" y1="892" x2="770" y2="892" class="ret"/><text x="855" y="884" text-anchor="middle" class="msg">工具结果</text>
  <line x1="770" y1="917" x2="430" y2="917" class="ret"/><text x="600" y="909" text-anchor="middle" class="msg">返回 Agent</text>
  <line x1="430" y1="940" x2="600" y2="940" class="call"/><text x="515" y="932" text-anchor="middle" class="msg">after_tool_call(result)</text>
  <line x1="600" y1="956" x2="1620" y2="956" class="ret"/><text x="1110" y="948" text-anchor="middle" class="msg">TraceRail 事件、摘要、帧与日志</text>

  <!-- Shutdown -->
  <line x1="95" y1="1020" x2="260" y2="1020" class="ret"/><text x="178" y="1012" text-anchor="middle" class="msg">退出 Session</text>
  <line x1="260" y1="1048" x2="1110" y2="1048" class="ret"/><text x="685" y="1040" text-anchor="middle" class="msg">Env.disconnect()</text>
  <line x1="1110" y1="1072" x2="1280" y2="1072" class="ret"/><text x="1195" y="1064" text-anchor="middle" class="msg">Driver.close()</text>
  <line x1="260" y1="1091" x2="1450" y2="1091" class="ret"/><text x="855" y="1083" text-anchor="middle" class="msg">停止 Detector sidecar</text>
  <line x1="260" y1="1107" x2="1620" y2="1107" class="ret"/><text x="940" y="1099" text-anchor="middle" class="msg">Trace 收尾并持久化 JSON / frames / logs</text>
  <line x1="1160" y1="1138" x2="1200" y2="1138" stroke="#334e68" stroke-width="2.1"/><text x="1210" y="1142" class="legend">主调用</text><line x1="1280" y1="1138" x2="1320" y2="1138" stroke="#d97706" stroke-width="2.1" stroke-dasharray="7 5"/><text x="1330" y="1142" class="legend">返回 / 可选支路 / 生命周期</text>
</svg>
