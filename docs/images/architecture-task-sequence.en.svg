<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1160" viewBox="0 0 1720 1160" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis single-task call sequence</title><desc id="desc">The six-layer execution chain plus Skill guidance, the visual-perception sidecar branch, and Trace evidence storage during one task.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="ret-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.actor{font-size:13px;font-weight:700}.actor-sub{font-size:10px;fill:#5b6b82}.phase{font-size:15px;font-weight:700}.msg{font-size:12px;font-weight:600}.note{font-size:11px;fill:#5b6b82}.call{stroke:#334e68;stroke-width:2.1;marker-end:url(#arrow)}.ret{stroke:#d97706;stroke-width:2.1;stroke-dasharray:7 5;marker-end:url(#ret-arrow)}.life{stroke:#9aabc0;stroke-width:1.4;stroke-dasharray:5 5}.legend{font-size:12px;fill:#526174}</style></defs>
  <rect width="1720" height="1160" rx="24" fill="#f4f7fc"/><text x="38" y="46" class="title">Single-task call sequence</text><text x="38" y="71" class="subtitle">Primary calls follow Agent → Rails → Tool → API → Env → Hardware; Skill and the visual sidecar join as side mechanisms.</text>
  <rect x="28" y="142" width="1664" height="210" rx="16" fill="#eaf3ff" stroke="#b7d2f7"/><text x="45" y="169" class="phase" fill="#1d4ed8">A. Startup, assembly, and side-mechanism initialization</text><rect x="28" y="365" width="1664" height="445" rx="16" fill="#eefaf5" stroke="#acd9c6"/><text x="45" y="392" class="phase" fill="#047857">B. One tool invocation: six-layer execution chain</text><rect x="28" y="823" width="1664" height="137" rx="16" fill="#fff7e8" stroke="#efc36f"/><text x="45" y="850" class="phase" fill="#b45309">C. Result propagation and evidence</text><rect x="28" y="973" width="1664" height="136" rx="16" fill="#f3efff" stroke="#c9bbf3"/><text x="45" y="1000" class="phase" fill="#6d28d9">D. Session shutdown</text>
  <g>
    <rect x="30" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="95" y="114" text-anchor="middle" class="actor">Caller</text><rect x="195" y="88" width="130" height="42" rx="9" fill="#2563eb"/><text x="260" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RobotSession</text><text x="260" y="121" text-anchor="middle" font-size="10" fill="#dbeafe">Agent Layer</text>
    <rect x="365" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="430" y="106" text-anchor="middle" class="actor">Agent</text><text x="430" y="121" text-anchor="middle" class="actor-sub">task orchestration</text><rect x="535" y="88" width="130" height="42" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="106" text-anchor="middle" class="actor">Rails</text><text x="600" y="121" text-anchor="middle" class="actor-sub">Rails Layer</text>
    <rect x="705" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="770" y="106" text-anchor="middle" class="actor">Tool Surface</text><text x="770" y="121" text-anchor="middle" class="actor-sub">Tool Layer</text><rect x="875" y="88" width="130" height="42" rx="9" fill="#f5f1ff" stroke="#aa94e7"/><text x="940" y="106" text-anchor="middle" class="actor">Robot API</text><text x="940" y="121" text-anchor="middle" class="actor-sub">API Layer</text>
    <rect x="1045" y="88" width="130" height="42" rx="9" fill="#ecf9f4" stroke="#76bfa1"/><text x="1110" y="106" text-anchor="middle" class="actor">BaseRobotEnv</text><text x="1110" y="121" text-anchor="middle" class="actor-sub">Env Layer</text><rect x="1215" y="88" width="130" height="42" rx="9" fill="#047857"/><text x="1280" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Driver / Hardware</text><text x="1280" y="121" text-anchor="middle" font-size="10" fill="#d1fae5">Hardware Layer</text>
    <rect x="1385" y="88" width="130" height="42" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="1450" y="106" text-anchor="middle" class="actor">Vision sidecar</text><text x="1450" y="121" text-anchor="middle" class="actor-sub">optional branch</text><rect x="1555" y="88" width="130" height="42" rx="9" fill="#d97706"/><text x="1620" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Trace store</text><text x="1620" y="121" text-anchor="middle" font-size="10" fill="#fef3c7">evidence output</text>
  </g>
  <g><line x1="95" y1="130" x2="95" y2="1112" class="life"/><line x1="260" y1="130" x2="260" y2="1112" class="life"/><line x1="430" y1="130" x2="430" y2="1112" class="life"/><line x1="600" y1="130" x2="600" y2="1112" class="life"/><line x1="770" y1="130" x2="770" y2="1112" class="life"/><line x1="940" y1="130" x2="940" y2="1112" class="life"/><line x1="1110" y1="130" x2="1110" y2="1112" class="life"/><line x1="1280" y1="130" x2="1280" y2="1112" class="life"/><line x1="1450" y1="130" x2="1450" y2="1112" class="life"/><line x1="1620" y1="130" x2="1620" y2="1112" class="life"/></g>
  <line x1="95" y1="190" x2="260" y2="190" class="call"/><text x="178" y="182" text-anchor="middle" class="msg">enter Session / connect()</text><line x1="260" y1="225" x2="1110" y2="225" class="ret"/><text x="685" y="217" text-anchor="middle" class="msg">Env.connect()</text><line x1="1110" y1="252" x2="1280" y2="252" class="ret"/><text x="1195" y="244" text-anchor="middle" class="msg">Driver connects</text><line x1="260" y1="277" x2="1450" y2="277" class="ret"/><text x="855" y="269" text-anchor="middle" class="msg">optional: start Detector sidecar</text><line x1="260" y1="305" x2="430" y2="305" class="call"/><text x="345" y="297" text-anchor="middle" class="msg">build Agent and tool set</text><rect x="700" y="286" width="500" height="42" rx="9" fill="#fff" stroke="#b9a8ec"/><text x="950" y="304" text-anchor="middle" class="msg">Capability gating during construction</text><text x="950" y="320" text-anchor="middle" class="note">Tool Surface = API Mixin capabilities ∩ Env hardware capabilities</text><line x1="600" y1="338" x2="430" y2="338" class="ret"/><text x="515" y="330" text-anchor="middle" class="msg">optional: inject SKILL.md guidance</text>
  <line x1="95" y1="420" x2="260" y2="420" class="call"/><text x="178" y="412" text-anchor="middle" class="msg">submit task</text><line x1="260" y1="455" x2="430" y2="455" class="call"/><text x="345" y="447" text-anchor="middle" class="msg">invoke(query)</text><line x1="430" y1="495" x2="600" y2="495" class="call"/><text x="515" y="487" text-anchor="middle" class="msg">before_tool_call</text><rect x="538" y="510" width="124" height="48" rx="8" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="530" text-anchor="middle" class="msg">checks and gates</text><text x="600" y="547" text-anchor="middle" class="note">reject if needed</text><line x1="600" y1="570" x2="430" y2="570" class="ret"/><text x="515" y="562" text-anchor="middle" class="msg">allow / correctable error</text><line x1="430" y1="605" x2="770" y2="605" class="call"/><text x="600" y="597" text-anchor="middle" class="msg">invoke exposed tool</text><line x1="770" y1="640" x2="940" y2="640" class="call"/><text x="855" y="632" text-anchor="middle" class="msg">bound method / action dispatch</text><line x1="940" y1="675" x2="1110" y2="675" class="call"/><text x="1025" y="667" text-anchor="middle" class="msg">stable Env verb</text><line x1="1110" y1="710" x2="1280" y2="710" class="call"/><text x="1195" y="702" text-anchor="middle" class="msg">SDK / protocol command</text><line x1="1280" y1="745" x2="1110" y2="745" class="ret"/><text x="1195" y="737" text-anchor="middle" class="msg">state / frame / outcome</text><line x1="940" y1="778" x2="1450" y2="778" class="ret"/><text x="1195" y="770" text-anchor="middle" class="msg">optional: VisionMixin → detect(frame)</text><line x1="1450" y1="800" x2="940" y2="800" class="ret"/><text x="1195" y="792" text-anchor="middle" class="note">detection/segmentation → raw projection → correction and geometry</text>
  <line x1="1110" y1="867" x2="940" y2="867" class="ret"/><text x="1025" y="859" text-anchor="middle" class="msg">RobotObservation / API result</text><line x1="940" y1="892" x2="770" y2="892" class="ret"/><text x="855" y="884" text-anchor="middle" class="msg">tool result</text><line x1="770" y1="917" x2="430" y2="917" class="ret"/><text x="600" y="909" text-anchor="middle" class="msg">return to Agent</text><line x1="430" y1="940" x2="600" y2="940" class="call"/><text x="515" y="932" text-anchor="middle" class="msg">after_tool_call(result)</text><line x1="600" y1="956" x2="1620" y2="956" class="ret"/><text x="1110" y="948" text-anchor="middle" class="msg">TraceRail events, summaries, frames, and logs</text>
  <line x1="95" y1="1020" x2="260" y2="1020" class="ret"/><text x="178" y="1012" text-anchor="middle" class="msg">exit Session</text><line x1="260" y1="1048" x2="1110" y2="1048" class="ret"/><text x="685" y="1040" text-anchor="middle" class="msg">Env.disconnect()</text><line x1="1110" y1="1072" x2="1280" y2="1072" class="ret"/><text x="1195" y="1064" text-anchor="middle" class="msg">Driver.close()</text><line x1="260" y1="1091" x2="1450" y2="1091" class="ret"/><text x="855" y="1083" text-anchor="middle" class="msg">stop Detector sidecar</text><line x1="260" y1="1107" x2="1620" y2="1107" class="ret"/><text x="940" y="1099" text-anchor="middle" class="msg">finalize and persist Trace JSON / frames / logs</text>
  <line x1="1160" y1="1138" x2="1200" y2="1138" stroke="#334e68" stroke-width="2.1"/><text x="1210" y="1142" class="legend">primary call</text><line x1="1300" y1="1138" x2="1340" y2="1138" stroke="#d97706" stroke-width="2.1" stroke-dasharray="7 5"/><text x="1350" y="1142" class="legend">return / optional branch / lifecycle</text>
</svg>
