<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis 模块归属与跨层关系</title><desc id="desc">六层执行主链与 Skill 指导面、能力门控、可选视觉感知支路之间的模块关系。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#19324d" flood-opacity="0.11"/></filter>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.lane{font-size:18px;font-weight:700;fill:#fff}.lane-en{font-size:11px;fill:#eaf2ff}.node{font-size:14px;font-weight:700}.sub{font-size:12px;fill:#5b6b82}.panel{font-size:16px;font-weight:700}.edge{fill:none;stroke:#334e68;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d97706;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dash-arrow)}.label{font-size:11px;font-weight:600;fill:#855108}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1600" height="1000" rx="24" fill="#f4f7fc"/><text x="38" y="47" class="title">模块归属与跨层关系</text><text x="38" y="72" class="subtitle">左侧是六层执行主链；右侧集中展示 Skill 指导、能力门控和可选视觉感知三类侧面机制</text>

  <!-- Six execution-chain lanes -->
  <g>
    <rect x="32" y="102" width="1118" height="120" rx="16" fill="#eaf3ff" stroke="#aac9f3"/><rect x="32" y="102" width="160" height="120" rx="16" fill="#2563eb"/><rect x="176" y="102" width="16" height="120" fill="#2563eb"/><text x="112" y="153" text-anchor="middle" class="lane">智能体层</text><text x="112" y="176" text-anchor="middle" class="lane-en">Agent Layer</text>
    <rect x="32" y="233" width="1118" height="106" rx="16" fill="#fff7e8" stroke="#efc36f"/><rect x="32" y="233" width="160" height="106" rx="16" fill="#d97706"/><rect x="176" y="233" width="16" height="106" fill="#d97706"/><text x="112" y="277" text-anchor="middle" class="lane">护栏层</text><text x="112" y="300" text-anchor="middle" class="lane-en">Rails Layer</text>
    <rect x="32" y="350" width="1118" height="102" rx="16" fill="#edf5ff" stroke="#b7d2f7"/><rect x="32" y="350" width="160" height="102" rx="16" fill="#3b82f6"/><rect x="176" y="350" width="16" height="102" fill="#3b82f6"/><text x="112" y="393" text-anchor="middle" class="lane">工具层</text><text x="112" y="416" text-anchor="middle" class="lane-en">Tool Layer</text>
    <rect x="32" y="463" width="1118" height="106" rx="16" fill="#f3efff" stroke="#c9bbf3"/><rect x="32" y="463" width="160" height="106" rx="16" fill="#8b5cf6"/><rect x="176" y="463" width="16" height="106" fill="#8b5cf6"/><text x="112" y="507" text-anchor="middle" class="lane">API 层</text><text x="112" y="530" text-anchor="middle" class="lane-en">API Layer</text>
    <rect x="32" y="580" width="1118" height="106" rx="16" fill="#ecf9f4" stroke="#acd9c6"/><rect x="32" y="580" width="160" height="106" rx="16" fill="#059669"/><rect x="176" y="580" width="16" height="106" fill="#059669"/><text x="112" y="624" text-anchor="middle" class="lane">环境层</text><text x="112" y="647" text-anchor="middle" class="lane-en">Env Layer</text>
    <rect x="32" y="697" width="1118" height="146" rx="16" fill="#e8f7f1" stroke="#9ed2bd"/><rect x="32" y="697" width="160" height="146" rx="16" fill="#047857"/><rect x="176" y="697" width="16" height="146" fill="#047857"/><text x="112" y="759" text-anchor="middle" class="lane">硬件层</text><text x="112" y="782" text-anchor="middle" class="lane-en">Hardware Layer</text>
  </g>

  <!-- Main-lane modules -->
  <g filter="url(#shadow)">
    <rect x="220" y="130" width="185" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="313" y="155" text-anchor="middle" class="node">Python / CLI / GUI</text><text x="313" y="175" text-anchor="middle" class="sub">任务入口与 Voice</text>
    <rect x="430" y="130" width="190" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="525" y="155" text-anchor="middle" class="node">配置对象</text><text x="525" y="175" text-anchor="middle" class="sub">Adapter + Agent Config</text>
    <rect x="645" y="130" width="210" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="750" y="155" text-anchor="middle" class="node">make_builder / Session</text><text x="750" y="175" text-anchor="middle" class="sub">装配与生命周期</text>
    <rect x="880" y="130" width="235" height="64" rx="11" fill="#2563eb"/><text x="998" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">run_robot_task / Agent</text><text x="998" y="175" text-anchor="middle" font-size="12" fill="#dbeafe">任务编排与执行</text>
    <rect x="240" y="252" width="875" height="68" rx="12" fill="#fff" stroke="#e8b75d"/><text x="678" y="274" text-anchor="middle" class="node">before_tool_call / after_tool_call 钩子管线</text><text x="678" y="296" text-anchor="middle" class="sub">Safety · Recovery · VisualFeedback · Diagnosis · Trace · SkillUse</text><text x="678" y="313" text-anchor="middle" class="sub">各 Rail 属于同一层，按配置和能力启用</text>
    <rect x="240" y="368" width="875" height="66" rx="12" fill="#fff" stroke="#88afe8"/><text x="678" y="390" text-anchor="middle" class="node">Tool Surface</text><text x="678" y="412" text-anchor="middle" class="sub">build_robot_tools · RobotControlTool · InProcessCodeTool</text><text x="678" y="429" text-anchor="middle" class="sub">运行时只调用已经通过能力门控的工具</text>
    <rect x="240" y="482" width="610" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="545" y="506" text-anchor="middle" class="node">BaseRobotApi + Capability Mixins</text><text x="545" y="527" text-anchor="middle" class="sub">Motion · Vision · Grasp · @robot_tool 语义</text><text x="545" y="544" text-anchor="middle" class="sub">适配器只覆写机型差异</text>
    <rect x="875" y="482" width="240" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="995" y="507" text-anchor="middle" class="node">API 能力</text><text x="995" y="528" text-anchor="middle" class="sub">由 Mixin MRO 自动推导</text>
    <rect x="240" y="599" width="360" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="420" y="624" text-anchor="middle" class="node">BaseRobotEnv</text><text x="420" y="645" text-anchor="middle" class="sub">唯一硬件契约与稳定动词</text>
    <rect x="625" y="599" width="245" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="748" y="624" text-anchor="middle" class="node">RobotObservation</text><text x="748" y="645" text-anchor="middle" class="sub">位姿、关节、图像、状态</text>
    <rect x="895" y="599" width="220" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="1005" y="624" text-anchor="middle" class="node">Env 硬件能力</text><text x="1005" y="645" text-anchor="middle" class="sub">人工 frozenset 声明</text>
    <rect x="240" y="737" width="230" height="68" rx="12" fill="#fff" stroke="#69b396"/><text x="355" y="762" text-anchor="middle" class="node">Vendor Driver</text><text x="355" y="783" text-anchor="middle" class="sub">serial / CAN / SDK</text>
    <rect x="500" y="737" width="300" height="68" rx="12" fill="#047857"/><text x="650" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Robot / Gripper / Suction</text><text x="650" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">真实机器人本体</text>
    <rect x="830" y="737" width="285" height="68" rx="12" fill="#047857"/><text x="973" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Camera / Depth</text><text x="973" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">视觉感知的数据源</text>
  </g>
  <path d="M405 162H430" class="edge"/><path d="M620 162H645" class="edge"/><path d="M855 162H880" class="edge"/><path d="M998 194V225H678V252" class="edge"/><path d="M678 320V368" class="edge"/><path d="M678 434V456H545V482" class="edge"/><path d="M545 550V574H420V599" class="edge"/><path d="M600 633H625" class="edge"/><path d="M420 667V714H355V737" class="edge"/><path d="M470 771H500" class="edge"/><path d="M355 805V826H973V805" class="edge"/>

  <!-- Side plane: Skill guidance -->
  <rect x="1180" y="102" width="388" height="218" rx="16" fill="#f3efff" stroke="#aa94e7"/><text x="1202" y="132" class="panel" fill="#6d28d9">Skill 指导面</text>
  <rect x="1210" y="153" width="328" height="62" rx="11" fill="#fff" stroke="#aa94e7"/><text x="1374" y="178" text-anchor="middle" class="node">SKILL.md</text><text x="1374" y="198" text-anchor="middle" class="sub">visual_pick · visual_place</text>
  <rect x="1210" y="232" width="328" height="62" rx="11" fill="#fff8eb" stroke="#e8b75d"/><text x="1374" y="257" text-anchor="middle" class="node">SkillUseRail 加载并注入</text><text x="1374" y="277" text-anchor="middle" class="sub">指导 Agent 选择和组合工具</text>
  <path d="M1374 215V232" class="dash"/><path d="M1210 263H1140V286H1115" class="dash"/><path d="M1210 263H1160V162H1115" class="dash"/>

  <!-- Side plane: capability gate -->
  <rect x="1180" y="335" width="388" height="278" rx="16" fill="#f7f4ff" stroke="#b9a8ec"/><text x="1202" y="365" class="panel" fill="#6d28d9">Tool / API / Env 跨层：能力门控</text>
  <rect x="1210" y="389" width="145" height="54" rx="10" fill="#fff" stroke="#aa94e7"/><text x="1283" y="412" text-anchor="middle" class="node">API 能力</text><text x="1283" y="430" text-anchor="middle" class="sub">Mixin MRO</text>
  <rect x="1393" y="389" width="145" height="54" rx="10" fill="#fff" stroke="#76bfa1"/><text x="1466" y="412" text-anchor="middle" class="node">Env 能力</text><text x="1466" y="430" text-anchor="middle" class="sub">硬件承诺</text>
  <rect x="1270" y="470" width="210" height="62" rx="11" fill="#7c3aed"/><text x="1375" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">API ∩ Env</text><text x="1375" y="516" text-anchor="middle" font-size="11" fill="#ede9fe">能力交集</text>
  <rect x="1270" y="548" width="210" height="46" rx="10" fill="#2563eb"/><text x="1375" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">可暴露 Tool Surface</text>
  <path d="M1283 443V458H1345V470" class="dash"/><path d="M1466 443V458H1405V470" class="dash"/><path d="M1375 532V548" class="dash"/><path d="M1270 571H1165V401H1115" class="dash"/><path d="M1115 516H1210V416" class="dash"/><path d="M1115 633H1466V443" class="dash"/>

  <!-- Side plane: visual perception branch -->
  <rect x="1180" y="628" width="388" height="215" rx="16" fill="#fff7e8" stroke="#efc36f"/><text x="1202" y="658" class="panel" fill="#b45309">可选视觉感知支路</text>
  <rect x="1210" y="680" width="145" height="58" rx="10" fill="#fff" stroke="#e8b75d"/><text x="1283" y="704" text-anchor="middle" class="node">Detector client</text><text x="1283" y="723" text-anchor="middle" class="sub">VisionMixin 调用</text>
  <rect x="1393" y="680" width="145" height="58" rx="10" fill="#fff" stroke="#e8b75d"/><text x="1466" y="704" text-anchor="middle" class="node">Detector sidecar</text><text x="1466" y="723" text-anchor="middle" class="sub">Session 管理</text>
  <rect x="1270" y="760" width="210" height="54" rx="10" fill="#d97706"/><text x="1375" y="783" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">GroundingDINO + SAM2</text><text x="1375" y="801" text-anchor="middle" font-size="11" fill="#fef3c7">检测与分割服务</text>
  <path d="M1355 709H1393" class="dash"/><path d="M1466 738V750H1375V760" class="dash"/><path d="M850 516H1160V709H1210" class="dash"/><path d="M750 130V90H1580V709H1538" class="dash"/><text x="1390" y="84" class="label">RobotSession 管理 sidecar 生命周期</text>

  <path d="M748 667V885H210V286H240" class="dash"/><text x="505" y="905" class="label">RobotObservation、工具结果与故障回流到 VisualFeedback / Diagnosis / Trace</text>
  <line x1="1040" y1="956" x2="1080" y2="956" stroke="#334e68" stroke-width="2.2"/><text x="1090" y="960" class="legend">主执行依赖</text><line x1="1190" y1="956" x2="1230" y2="956" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 6"/><text x="1240" y="960" class="legend">指导 / 门控 / 支路 / 回流</text>
</svg>
