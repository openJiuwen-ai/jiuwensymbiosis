<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc">
  <title id="title">动作工具的构建与能力过滤</title>
  <desc id="desc">共享动作契约绑定到适配器方法形成 ToolMeta，工具构建器结合 Env 能力筛选已实现动作，生成独立动作工具。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334e68"/></marker>
    <marker id="input-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b45309"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; } path, line { stroke-linejoin: round; stroke-linecap: round; }</style>
  </defs>
  <rect x="0" y="0" width="1200" height="928" rx="24" fill="#f4f7fc"/>
  <text id="text-1" x="40" y="52" font-size="32" font-weight="700" fill="#172033" text-anchor="start" data-max-width="1120">动作工具的构建与能力过滤</text>
  <text id="text-2" x="40" y="91" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1120">构建关系图：契约绑定到方法，再结合硬件能力生成动作工具；箭头不表示运行时调用。</text>
  <rect x="40" y="130" width="1120" height="126" rx="16" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="40" y="130" width="168" height="126" rx="16" fill="#7c3aed"/>
  <rect x="192" y="130" width="16" height="126" rx="0" fill="#7c3aed"/>
  <text id="text-3" x="124.0" y="201.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">声明契约</text>
  <rect x="244" y="150" width="440" height="88" rx="11" fill="#ffffff" stroke="#c9bbf3" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-4" x="464.0" y="184" font-size="23" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="408">ActionSpec</text>
  <text id="text-5" x="464.0" y="216" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="408">动作名称、参数、结果与能力要求</text>
  <text id="text-6" x="736" y="178" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="390">共享契约统一声明</text>
  <text id="text-7" x="736" y="214" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="390">各适配器引用同一份 spec</text>
  <rect x="40" y="282" width="1120" height="144" rx="16" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="40" y="282" width="168" height="144" rx="16" fill="#7c3aed"/>
  <rect x="192" y="282" width="16" height="144" rx="0" fill="#7c3aed"/>
  <text id="text-8" x="124.0" y="362.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">绑定实现</text>
  <rect x="244" y="304" width="440" height="100" rx="11" fill="#ffffff" stroke="#c9bbf3" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-9" x="464.0" y="338" font-size="23" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="408">适配器方法</text>
  <text id="text-10" x="464.0" y="370" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="408">@implements(SPEC)</text>
  <rect x="740" y="304" width="392" height="100" rx="11" fill="#ffffff" stroke="#c9bbf3" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-11" x="936.0" y="338" font-size="23" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="360">ToolMeta</text>
  <text id="text-12" x="936.0" y="370" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="360">spec + 方法参数 schema</text>
  <path d="M464 238 L464 304" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M684 354 L740 354" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="40" y="458" width="1120" height="180" rx="16" fill="#fff7e8" stroke="#efc36f" stroke-width="1.5"/>
  <rect x="40" y="458" width="168" height="180" rx="16" fill="#b45309"/>
  <rect x="192" y="458" width="16" height="180" rx="0" fill="#b45309"/>
  <text id="text-13" x="124.0" y="556.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">筛选动作</text>
  <rect x="244" y="482" width="440" height="126" rx="11" fill="#ffffff" stroke="#efc36f" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-14" x="464.0" y="516" font-size="22" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="408">build_robot_tools</text>
  <text id="text-15" x="464.0" y="548" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="408">API 能力 ∩ Env 能力</text>
  <text id="text-16" x="464.0" y="577" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="408">有能力要求的动作须通过过滤</text>
  <rect x="740" y="482" width="392" height="126" rx="11" fill="#ffffff" stroke="#acd9c6" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-17" x="936.0" y="516" font-size="23" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="360">Env 硬件能力</text>
  <text id="text-18" x="936.0" y="548" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="360">effective_capabilities</text>
  <text id="text-19" x="936.0" y="577" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="360">显式声明 + 模型派生</text>
  <path d="M936 404 V442 H464 V482" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M740 545 L684 545" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="40" y="676" width="1120" height="136" rx="16" fill="#edf5ff" stroke="#b7d2f7" stroke-width="1.5"/>
  <rect x="40" y="676" width="168" height="136" rx="16" fill="#2563eb"/>
  <rect x="192" y="676" width="16" height="136" rx="0" fill="#2563eb"/>
  <text id="text-20" x="124.0" y="752.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="144">生成工具</text>
  <rect x="244" y="696" width="888" height="94" rx="11" fill="#ffffff" stroke="#b7d2f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text id="text-21" x="688.0" y="730" font-size="23" font-weight="700" fill="#172033" text-anchor="middle" data-max-width="856">可用的独立动作工具</text>
  <text id="text-22" x="688.0" y="762" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="856">Agent 设置 planner_only=True，仅暴露允许规划的动作。</text>
  <path d="M464 608 L464 696" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="40" y="846" width="1120" height="54" rx="10" fill="#f0f4f9" stroke="#bac9da" stroke-width="1.5"/>
  <text id="text-23" x="60" y="876" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1080">home 没有能力要求；Python 内部直接调用 API / Env 不经过此构建过滤。</text>
</svg>
