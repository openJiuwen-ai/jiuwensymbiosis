<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis seven architectural domains</title><desc id="desc">A six-layer runtime execution chain from Agent to Hardware plus Skill as the seventh guidance domain.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.name{font-size:17px;font-weight:700;fill:#fff}.node{font-size:16px;font-weight:700}.sub{font-size:13px;fill:#5b6b82}.label{font-size:13px;font-weight:700}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="#f4f7fc"/><text x="42" y="48" class="title">Seven domains: six-layer execution chain + Skill guidance plane</text><text x="42" y="73" class="subtitle">The main chain carries runtime tool calls. SkillUseRail loads Skill guidance for the Agent; it does not forward Tool → API calls.</text>
  <g filter="url(#shadow)">
    <rect x="90" y="110" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="110" width="160" height="84" rx="14" fill="#2563eb"/><rect x="236" y="110" width="14" height="84" fill="#2563eb"/><text x="170" y="160" text-anchor="middle" class="name">Agent Layer</text><text x="278" y="145" class="node">RobotSession · build_robot_agent() · run_robot_task()</text><text x="278" y="169" class="sub">task entry, assembly, session lifecycle, and model orchestration</text>
    <rect x="90" y="212" width="720" height="84" rx="14" fill="#fff" stroke="#efc36f"/><rect x="90" y="212" width="160" height="84" rx="14" fill="#d97706"/><rect x="236" y="212" width="14" height="84" fill="#d97706"/><text x="170" y="262" text-anchor="middle" class="name">Rails Layer</text><text x="278" y="247" class="node">Safety · Recovery · VisualFeedback · Trace · Diagnosis</text><text x="278" y="271" class="sub">checks, recovery, feedback, and execution evidence around tool calls</text>
    <rect x="90" y="314" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="314" width="160" height="84" rx="14" fill="#3b82f6"/><rect x="236" y="314" width="14" height="84" fill="#3b82f6"/><text x="170" y="364" text-anchor="middle" class="name">Tool Layer</text><text x="278" y="349" class="node">build_robot_tools · RobotControlTool · CodeTool</text><text x="278" y="373" class="sub">exposes only the API and Env capability intersection</text>
    <rect x="90" y="416" width="720" height="84" rx="14" fill="#fff" stroke="#b9a8ec"/><rect x="90" y="416" width="160" height="84" rx="14" fill="#8b5cf6"/><rect x="236" y="416" width="14" height="84" fill="#8b5cf6"/><text x="170" y="466" text-anchor="middle" class="name">API Layer</text><text x="278" y="451" class="node">BaseRobotApi · Motion / Vision / Grasp Mixins</text><text x="278" y="475" class="sub">shared @robot_tool semantics and body-specific overrides</text>
    <rect x="90" y="518" width="720" height="84" rx="14" fill="#fff" stroke="#83c5aa"/><rect x="90" y="518" width="160" height="84" rx="14" fill="#059669"/><rect x="236" y="518" width="14" height="84" fill="#059669"/><text x="170" y="568" text-anchor="middle" class="name">Env Layer</text><text x="278" y="553" class="node">BaseRobotEnv · RobotObservation</text><text x="278" y="577" class="sub">single hardware contract, capability declaration, structured state</text>
    <rect x="90" y="620" width="720" height="84" rx="14" fill="#fff" stroke="#69b396"/><rect x="90" y="620" width="160" height="84" rx="14" fill="#047857"/><rect x="236" y="620" width="14" height="84" fill="#047857"/><text x="170" y="670" text-anchor="middle" class="name">Hardware Layer</text><text x="278" y="655" class="node">Vendor Driver · Robot · Gripper · Camera</text><text x="278" y="679" class="sub">vendor SDKs, serial, CAN, sockets, and physical devices</text>
  </g>
  <g><path d="M450 194V212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 296V314" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 398V416" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 500V518" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 602V620" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/></g>
  <rect x="870" y="300" width="270" height="210" rx="18" fill="#f3efff" stroke="#aa94e7" stroke-width="2"/><rect x="870" y="300" width="270" height="58" rx="18" fill="#7c3aed"/><rect x="870" y="342" width="270" height="16" fill="#7c3aed"/><text x="1005" y="336" text-anchor="middle" class="name">Skill Layer</text><text x="1005" y="390" text-anchor="middle" class="node">SKILL.md</text><text x="1005" y="418" text-anchor="middle" class="sub">visual_pick · visual_place</text><text x="1005" y="447" text-anchor="middle" class="sub">loaded by SkillUseRail</text><text x="1005" y="475" text-anchor="middle" class="sub">guides the Agent's tool selection</text>
  <path d="M1005 300V152H810" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="920" y="140" class="label" fill="#b45309">guides Agent</text>
  <path d="M55 662V152" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="42" y="742" class="label" fill="#b45309">observations and failures flow upward</text>
  <line x1="760" y1="775" x2="800" y2="775" stroke="#2563eb" stroke-width="2.5"/><text x="810" y="779" class="legend">runtime call</text><line x1="930" y1="775" x2="970" y2="775" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6"/><text x="980" y="779" class="legend">guidance / feedback</text>
</svg>
