  <text id="text-10" x="226" y="379" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">Action tools · InProcessCodeTool</text>
  <text id="text-11" x="226" y="410" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">Configured tools; Python has its own execution path</text>
  <rect x="40" y="450" width="740" height="88" rx="16" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="40" y="450" width="160" height="88" rx="16" fill="#7c3aed"/>
  <rect x="184" y="450" width="16" height="88" rx="0" fill="#7c3aed"/>
