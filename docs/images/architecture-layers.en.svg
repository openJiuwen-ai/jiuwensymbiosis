  <text id="text-19" x="226" y="697" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">Driver · Robot · Gripper · Camera</text>
  <text id="text-20" x="226" y="728" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">Vendor SDKs, serial, CAN, device communication</text>
  <rect x="848" y="132" width="312" height="192" rx="18" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="848" y="132" width="312" height="54" rx="18" fill="#7c3aed"/>
  <rect x="848" y="168" width="312" height="18" rx="0" fill="#7c3aed"/>
  <text id="text-21" x="1004.0" y="167" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">Skill library</text>
  <text id="text-22" x="1004.0" y="220" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">SKILL.md: flows + contracts</text>
  <text id="text-23" x="1004.0" y="251" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">Load or compile by mode</text>
  <text id="text-24" x="1004.0" y="282" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">Planner selects and expands</text>
  <rect x="848" y="354" width="312" height="202" rx="18" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="848" y="354" width="312" height="54" rx="18" fill="#047857"/>
  <rect x="848" y="390" width="312" height="18" rx="0" fill="#047857"/>
  <text id="text-25" x="1004.0" y="389" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">World-state snapshot</text>
  <text id="text-26" x="1004.0" y="442" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">WorldState</text>
  <text id="text-27" x="1004.0" y="473" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">Observations + memory</text>
  <text id="text-28" x="1004.0" y="504" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">With reachability information</text>
  <rect x="848" y="586" width="312" height="164" rx="18" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="848" y="586" width="312" height="54" rx="18" fill="#047857"/>
  <rect x="848" y="622" width="312" height="18" rx="0" fill="#047857"/>
  <text id="text-29" x="1004.0" y="621" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">Shared algorithms</text>
  <text id="text-30" x="1004.0" y="674" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">perception · motion</text>
  <text id="text-31" x="1004.0" y="705" font-size="19" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">kinematics: model computation</text>
