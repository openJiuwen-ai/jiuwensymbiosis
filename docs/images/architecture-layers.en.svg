  <text id="text-14" x="226" y="516" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">Bind contracts; reuse algorithms or adapt devices</text>
  <rect x="40" y="556" width="740" height="88" rx="16" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="40" y="556" width="160" height="88" rx="16" fill="#047857"/>
  <rect x="184" y="556" width="16" height="88" rx="0" fill="#047857"/>
