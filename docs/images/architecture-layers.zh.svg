<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc">
  <title id="title">架构总览：执行职责与规划输入</title>
  <desc id="desc">六层职责沿用原有分层图：编排、护栏、工具、API、环境和硬件。技能库与世界状态提供规划输入，API 调用共享算法。RobotSession 负责连接与资源清理。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334e68"/></marker>
    <marker id="input-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b45309"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; } path, line { stroke-linejoin: round; stroke-linecap: round; }</style>
  </defs>
  <rect x="0" y="0" width="1200" height="954" rx="24" fill="#f4f7fc"/>
  <text id="text-1" x="40" y="52" font-size="32" font-weight="700" fill="#172033" text-anchor="start" data-max-width="1120">架构总览：执行职责与规划输入</text>
  <text id="text-2" x="40" y="91" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="1120">左侧按职责分层，右侧提供规划信息与共享计算；各层不代表固定的逐层调用顺序。</text>
  <rect x="40" y="132" width="740" height="88" rx="16" fill="#eaf3ff" stroke="#aac9f3" stroke-width="1.5"/>
  <rect x="40" y="132" width="160" height="88" rx="16" fill="#2563eb"/>
  <rect x="184" y="132" width="16" height="88" rx="0" fill="#2563eb"/>
  <text id="text-3" x="120.0" y="184.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">编排层</text>
  <text id="text-4" x="226" y="167" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">run_robot_task · Agent</text>
  <text id="text-5" x="226" y="198" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">按执行模式组织任务与动作</text>
  <rect x="40" y="238" width="740" height="88" rx="16" fill="#fff7e8" stroke="#efc36f" stroke-width="1.5"/>
  <rect x="40" y="238" width="160" height="88" rx="16" fill="#b45309"/>
  <rect x="184" y="238" width="16" height="88" rx="0" fill="#b45309"/>
  <text id="text-6" x="120.0" y="290.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">护栏层</text>
  <text id="text-7" x="226" y="273" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">Safety · Recovery · Feedback · Trace</text>
  <text id="text-8" x="226" y="304" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">按工具和模型事件检查、恢复与记录</text>
  <rect x="40" y="344" width="740" height="88" rx="16" fill="#edf5ff" stroke="#b7d2f7" stroke-width="1.5"/>
  <rect x="40" y="344" width="160" height="88" rx="16" fill="#2563eb"/>
  <rect x="184" y="344" width="16" height="88" rx="0" fill="#2563eb"/>
  <text id="text-9" x="120.0" y="396.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">工具层</text>
  <text id="text-10" x="226" y="379" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">动作工具 · InProcessCodeTool</text>
  <text id="text-11" x="226" y="410" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">按配置提供工具；Python 有独立执行路径</text>
  <rect x="40" y="450" width="740" height="88" rx="16" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="40" y="450" width="160" height="88" rx="16" fill="#7c3aed"/>
  <rect x="184" y="450" width="16" height="88" rx="0" fill="#7c3aed"/>
  <text id="text-12" x="120.0" y="502.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">API 层</text>
  <text id="text-13" x="226" y="485" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">ActionSpec · 适配器 API · defaults</text>
  <text id="text-14" x="226" y="516" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">绑定共享契约，复用算法或适配设备</text>
  <rect x="40" y="556" width="740" height="88" rx="16" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="40" y="556" width="160" height="88" rx="16" fill="#047857"/>
  <rect x="184" y="556" width="16" height="88" rx="0" fill="#047857"/>
  <text id="text-15" x="120.0" y="608.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">环境层</text>
  <text id="text-16" x="226" y="591" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">BaseRobotEnv · RobotObservation</text>
  <text id="text-17" x="226" y="622" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">统一硬件操作、能力声明与观测</text>
  <rect x="40" y="662" width="740" height="88" rx="16" fill="#e8f7f1" stroke="#9ed2bd" stroke-width="1.5"/>
  <rect x="40" y="662" width="160" height="88" rx="16" fill="#047857"/>
  <rect x="184" y="662" width="16" height="88" rx="0" fill="#047857"/>
  <text id="text-18" x="120.0" y="714.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="136">硬件层</text>
  <text id="text-19" x="226" y="697" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="534">Driver · Robot · Gripper · Camera</text>
  <text id="text-20" x="226" y="728" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="534">厂商 SDK、串口、CAN 与设备通信</text>
  <rect x="848" y="132" width="312" height="192" rx="18" fill="#f3efff" stroke="#c9bbf3" stroke-width="1.5"/>
  <rect x="848" y="132" width="312" height="54" rx="18" fill="#7c3aed"/>
  <rect x="848" y="168" width="312" height="18" rx="0" fill="#7c3aed"/>
  <text id="text-21" x="1004.0" y="167" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">技能库</text>
  <text id="text-22" x="1004.0" y="220" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">SKILL.md：流程与契约</text>
  <text id="text-23" x="1004.0" y="251" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">按执行模式加载或编译</text>
  <text id="text-24" x="1004.0" y="282" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">供规划器选择和展开</text>
  <rect x="848" y="354" width="312" height="202" rx="18" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="848" y="354" width="312" height="54" rx="18" fill="#047857"/>
  <rect x="848" y="390" width="312" height="18" rx="0" fill="#047857"/>
  <text id="text-25" x="1004.0" y="389" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">世界状态快照</text>
  <text id="text-26" x="1004.0" y="442" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">WorldState</text>
  <text id="text-27" x="1004.0" y="473" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">汇总观测与执行记忆</text>
  <text id="text-28" x="1004.0" y="504" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">并补充可达性信息</text>
  <rect x="848" y="586" width="312" height="164" rx="18" fill="#ecf9f4" stroke="#acd9c6" stroke-width="1.5"/>
  <rect x="848" y="586" width="312" height="54" rx="18" fill="#047857"/>
  <rect x="848" y="622" width="312" height="18" rx="0" fill="#047857"/>
  <text id="text-29" x="1004.0" y="621" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="288">共享算法</text>
  <text id="text-30" x="1004.0" y="674" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">perception · motion</text>
  <text id="text-31" x="1004.0" y="705" font-size="20" font-weight="400" fill="#526174" text-anchor="middle" data-max-width="284">kinematics：模型计算</text>
  <path d="M848 180 L780 180" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#input-arrow)"/>
  <path d="M848 456 H814 V208 H780" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#input-arrow)"/>
  <path d="M780 494 H814 V690 H848" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="40" y="790" width="1120" height="82" rx="16" fill="#eaf3ff" stroke="#aac9f3" stroke-width="1.5"/>
  <rect x="40" y="790" width="190" height="82" rx="16" fill="#2563eb"/>
  <rect x="214" y="790" width="16" height="82" rx="0" fill="#2563eb"/>
  <text id="text-32" x="135.0" y="839.0" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" data-max-width="166">RobotSession</text>
  <text id="text-33" x="256" y="822" font-size="23" font-weight="700" fill="#172033" text-anchor="start" data-max-width="878">会话生命周期</text>
  <text id="text-34" x="256" y="851" font-size="20" font-weight="400" fill="#526174" text-anchor="start" data-max-width="878">连接 Env，管理客户端与可选本地进程，退出时清理资源。</text>
  <path d="M480 915 L526 915" fill="none" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text id="text-35" x="541" y="922" font-size="19" font-weight="400" fill="#526174" text-anchor="start" data-max-width="210">调用共享算法</text>
  <path d="M785 915 L831 915" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#input-arrow)"/>
  <text id="text-36" x="846" y="922" font-size="19" font-weight="400" fill="#526174" text-anchor="start" data-max-width="300">提供规划输入</text>
</svg>
