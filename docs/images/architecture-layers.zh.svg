<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis 七个架构域</title><desc id="desc">六层运行时执行主链从 Agent 到 Hardware，Skill 作为第七个架构域向 Agent 提供指导。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.name{font-size:17px;font-weight:700;fill:#fff}.en{font-size:11px;fill:#eaf2ff}.node{font-size:16px;font-weight:700}.sub{font-size:13px;fill:#5b6b82}.label{font-size:13px;font-weight:700}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="#f4f7fc"/><text x="42" y="48" class="title">七个架构域：六层执行主链 + Skill 指导面</text><text x="42" y="73" class="subtitle">主链承载运行时工具调用；Skill 由 SkillUseRail 加载并指导 Agent，不转发 Tool → API 调用</text>
  <g filter="url(#shadow)">
    <rect x="90" y="110" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="110" width="160" height="84" rx="14" fill="#2563eb"/><rect x="236" y="110" width="14" height="84" fill="#2563eb"/><text x="170" y="145" text-anchor="middle" class="name">智能体层</text><text x="170" y="166" text-anchor="middle" class="en">Agent Layer</text><text x="278" y="145" class="node">RobotSession · build_robot_agent() · run_robot_task()</text><text x="278" y="169" class="sub">任务入口、装配、会话生命周期与模型编排</text>
    <rect x="90" y="212" width="720" height="84" rx="14" fill="#fff" stroke="#efc36f"/><rect x="90" y="212" width="160" height="84" rx="14" fill="#d97706"/><rect x="236" y="212" width="14" height="84" fill="#d97706"/><text x="170" y="247" text-anchor="middle" class="name">护栏层</text><text x="170" y="268" text-anchor="middle" class="en">Rails Layer</text><text x="278" y="247" class="node">Safety · Recovery · VisualFeedback · Trace · Diagnosis</text><text x="278" y="271" class="sub">工具调用前后检查、恢复、反馈与执行留痕</text>
    <rect x="90" y="314" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="314" width="160" height="84" rx="14" fill="#3b82f6"/><rect x="236" y="314" width="14" height="84" fill="#3b82f6"/><text x="170" y="349" text-anchor="middle" class="name">工具层</text><text x="170" y="370" text-anchor="middle" class="en">Tool Layer</text><text x="278" y="349" class="node">build_robot_tools · RobotControlTool · CodeTool</text><text x="278" y="373" class="sub">仅暴露 API 与 Env 能力交集内的工具</text>
    <rect x="90" y="416" width="720" height="84" rx="14" fill="#fff" stroke="#b9a8ec"/><rect x="90" y="416" width="160" height="84" rx="14" fill="#8b5cf6"/><rect x="236" y="416" width="14" height="84" fill="#8b5cf6"/><text x="170" y="451" text-anchor="middle" class="name">API 层</text><text x="170" y="472" text-anchor="middle" class="en">API Layer</text><text x="278" y="451" class="node">BaseRobotApi · Motion / Vision / Grasp Mixins</text><text x="278" y="475" class="sub">@robot_tool 通用语义与机型差异覆写</text>
    <rect x="90" y="518" width="720" height="84" rx="14" fill="#fff" stroke="#83c5aa"/><rect x="90" y="518" width="160" height="84" rx="14" fill="#059669"/><rect x="236" y="518" width="14" height="84" fill="#059669"/><text x="170" y="553" text-anchor="middle" class="name">环境层</text><text x="170" y="574" text-anchor="middle" class="en">Env Layer</text><text x="278" y="553" class="node">BaseRobotEnv · RobotObservation</text><text x="278" y="577" class="sub">唯一硬件契约、硬件能力声明与结构化观测</text>
    <rect x="90" y="620" width="720" height="84" rx="14" fill="#fff" stroke="#69b396"/><rect x="90" y="620" width="160" height="84" rx="14" fill="#047857"/><rect x="236" y="620" width="14" height="84" fill="#047857"/><text x="170" y="655" text-anchor="middle" class="name">硬件层</text><text x="170" y="676" text-anchor="middle" class="en">Hardware Layer</text><text x="278" y="655" class="node">Vendor Driver · Robot · Gripper · Camera</text><text x="278" y="679" class="sub">厂商 SDK、串口、CAN、Socket 与真实设备</text>
  </g>
  <g><path d="M450 194V212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 296V314" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 398V416" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 500V518" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 602V620" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/></g>
  <rect x="870" y="300" width="270" height="210" rx="18" fill="#f3efff" stroke="#aa94e7" stroke-width="2"/><rect x="870" y="300" width="270" height="58" rx="18" fill="#7c3aed"/><rect x="870" y="342" width="270" height="16" fill="#7c3aed"/><text x="1005" y="328" text-anchor="middle" class="name">技能层 · Skill Layer</text><text x="1005" y="390" text-anchor="middle" class="node">SKILL.md</text><text x="1005" y="418" text-anchor="middle" class="sub">visual_pick · visual_place</text><text x="1005" y="447" text-anchor="middle" class="sub">由 SkillUseRail 加载</text><text x="1005" y="475" text-anchor="middle" class="sub">作为上下文指导 Agent 选用工具</text>
  <path d="M1005 300V152H810" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="920" y="140" class="label" fill="#b45309">指导 Agent</text>
  <path d="M55 662V152" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="42" y="742" class="label" fill="#b45309">观测与故障上行</text>
  <line x1="760" y1="775" x2="800" y2="775" stroke="#2563eb" stroke-width="2.5"/><text x="810" y="779" class="legend">运行时主调用</text><line x1="930" y1="775" x2="970" y2="775" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6"/><text x="980" y="779" class="legend">指导 / 观测回流</text>
</svg>
