[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwensymbiosis-example-gui"
version = "0.1.0"
description = "Minimal third-party GUI plugin example for JiuwenSymbiosis"
requires-python = ">=3.11,<3.14"
dependencies = ["jiuwensymbiosis>=0.1.0"]

[project.entry-points."jiuwensymbiosis.gui"]
example = "jiuwensymbiosis_example_gui.plugin:describe"

[tool.setuptools.packages.find]
where = ["."]
include = ["jiuwensymbiosis_example_gui*"]

[tool.setuptools.package-data]
jiuwensymbiosis_example_gui = ["configs/*.json"]
