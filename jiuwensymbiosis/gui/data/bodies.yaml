# 内置本体(机器人形态)清单 —— GUI 内部资产,随包发布、只读。
# 新增/修改本体请改这里;`adapter` 引用 jiuwensymbiosis.adapters.<adapter> 包(约定导出
# build_<adapter>_session),`default_config_relpath` 指向该本体那份"与具体任务无关"的默认
# 真机配置(用户后续可指向别的配置)。接入一种新硬件 = 6 个适配器文件 + 这里一条数据。
bodies:
  - key: piper
    display_name: "Piper 六轴机械臂"
    adapter: piper
    default_config_relpath: "piper/piper.yaml"
  - key: so101
    display_name: "SO-101 五轴机械臂"
    adapter: so101
    default_config_relpath: "so101/so101.yaml"
  - key: cruzr
    display_name: "Cruzr 双臂移动机器人"
    adapter: cruzr
    default_config_relpath: "cruzr/cruzr.yaml"
